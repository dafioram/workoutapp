<!doctype html>
<html>
<head>
  <title>Workout History</title>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#4caf50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="static/icons/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>Workout History for <span id="usernameDisplay"></span></h1>
  
  <section>
    <h2>Backup</h2>
    <p>
      Your history is stored only on this device. Export a backup now and then
      (and add the app to your home screen) so it isn't lost if the browser clears its data.
    </p>
    <button type="button" onclick="exportHistory()">Export history</button>
    <button type="button" onclick="document.getElementById('importFile').click()">Import backup</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importHistory(this)">
    <p id="backupStatus"></p>
  </section>

  <div id="historyContainer">
      <p>Loading history...</p>
  </div>

  <p><a href="index.html">Back to Generator</a></p>

<script src="database.js"></script>
<script src="app.js"></script>
  <script>
    function setBackupStatus(msg) {
        document.getElementById("backupStatus").textContent = msg;
    }

    async function exportHistory() {
        try {
            const workouts = await DB.getAllWorkouts();
            const backup = {
                app: "workoutapp",
                format: 1,
                exported: new Date().toISOString(),
                workouts
            };
            const filename = `workout_log_${new Date().toISOString().slice(0, 10)}.json`;
            const file = new File([JSON.stringify(backup, null, 2)], filename, { type: "application/json" });

            // iOS home-screen apps can't download files; the share sheet
            // offers "Save to Files", email, etc. instead.
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file], title: "Workout history backup" });
                    setBackupStatus(`Exported ${workouts.length} workouts.`);
                } catch (err) {
                    if (err.name !== "AbortError") throw err;
                }
                return;
            }

            const url = URL.createObjectURL(file);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            setBackupStatus(`Exported ${workouts.length} workouts.`);
        } catch (err) {
            console.error("Export failed:", err);
            setBackupStatus("Export failed.");
        }
    }

    async function importHistory(input) {
        const file = input.files[0];
        input.value = "";
        if (!file) return;

        try {
            const data = JSON.parse(await file.text());
            const workouts = Array.isArray(data) ? data : data.workouts;
            if (!Array.isArray(workouts)) throw new Error("No workouts in file");

            const { added, skipped } = await DB.importWorkouts(workouts);
            setBackupStatus(`Imported ${added} workouts` + (skipped ? ` (${skipped} already here or invalid).` : "."));
            if (added) setTimeout(() => location.reload(), 1200);
        } catch (err) {
            console.error("Import failed:", err);
            setBackupStatus("Import failed: not a valid backup file.");
        }
    }

    // Load a past workout into the timer with the same settings
    async function repeatWorkout(w) {
        let library = {};
        try {
            library = await DB.getExerciseMap();
        } catch (err) {
            console.warn("Exercise library unavailable; using saved names", err);
        }
        // Prefer the current library entry (description, image); fall back to what was saved
        const exercises = w.exercises
            .slice()
            .sort((a, b) => (a.order_index ?? 0) - (b.order_index ?? 0))
            .map(ex => library[ex.id] || { id: ex.id, name: ex.name, muscle: ex.muscle });

        AppLogic.Session.set("current_workout", exercises);
        AppLogic.Session.set("num_sets", Number(w.num_sets));
        AppLogic.Session.set("ex_duration", Number(w.exercise_duration));
        AppLogic.Session.set("rest_duration", Number(w.rest_duration));
        AppLogic.Session.set("set_rest", Number(w.set_rest));
        AppLogic.Session.set("username", w.username);
        location.href = "timer.html";
    }

    document.addEventListener("DOMContentLoaded", async () => {
        try {
            await window.AppReady;
        } catch (err) {
            // History is local; show it even if the exercise download failed
            console.error("App initialization failed:", err);
        }
		
        const username = "Bruno";
        document.getElementById("usernameDisplay").innerText = username;
        
        const container = document.getElementById("historyContainer");
        const workouts = await window.DB.getWorkoutsForUser(username);

		console.log("History workouts:", workouts);

        if (!workouts || workouts.length === 0) {
            container.innerHTML = `<p>No workouts saved yet for ${username}.</p>`;
            return;
        }

        let html = "<ul>";
        workouts.forEach(w => {
            const totalSecs = AppLogic.calculateTotalTime(
                w.exercises.length, w.num_sets, w.exercise_duration, w.rest_duration, w.set_rest
            );
            
            html += `
                <li>
                    <strong>${AppLogic.formatLocalDateTime(DB.parseTimestamp(w.timestamp))}</strong><br>
                    Sets: ${w.num_sets},
                    Exercise Duration: ${w.exercise_duration}s,
                    Rest between exercises: ${w.rest_duration}s,
                    Rest between sets: ${(w.set_rest / 60).toFixed(1)} min<br>
                    <em>Total Time: ${AppLogic.formatTime(totalSecs)}</em>
                    ${w.notes ? `<br><em>${w.notes}</em>` : ""}
                    <br><button type="button" data-repeat="${w.id}">Repeat</button>
                    <ul>
                        ${w.exercises.map(ex => `<li>${ex.name} (ID: ${ex.id})</li>`).join('')}
                    </ul>
                </li>
            `;
        });
        html += "</ul>";
        container.innerHTML = html;

        container.addEventListener("click", (e) => {
            const btn = e.target.closest("[data-repeat]");
            if (!btn) return;
            const w = workouts.find(w => String(w.id) === btn.dataset.repeat);
            if (w) repeatWorkout(w);
        });
    });
  </script>
</body>
</html>
