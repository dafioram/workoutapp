<!doctype html>
<html>
<head>

<!-- Unified Progress Bar -->
<div class="progress-wrapper">
  {% for s in range(num_sets) %}
    <div class="set-segment" id="set-{{s}}">
      <div class="fill" id="set-fill-{{s}}"></div>
    </div>
  {% endfor %}
</div>

<style>
.progress-wrapper {
  display: flex;
  gap: 4px; /* space between sets */
  margin: 20px auto;
  width: 80%;
  height: 25px;
}

.set-segment {
  flex: 1; /* each set is equal width */
  background: #ddd;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}

.fill {
  background: linear-gradient(90deg, #4caf50, #2e7d32);
  height: 100%;
  width: 0%; /* updated by JS */
  transition: width 0.5s ease;
}
</style>

  <title>Workout Timer</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 20px; }
    #exercise { font-size: 2em; margin: 20px 0; }
    #time { font-size: 3em; margin: 20px 0; }
    #next { color: gray; margin: 10px 0; }
    #exercise-img { height: 300px; width: auto; margin: 20px auto; display: block; }
    #next-img { max-width: 150px; max-height: 150px; margin: 10px auto; display: block; opacity: 0.6; }
    button { padding: 10px 20px; margin: 10px; }
    ul { text-align: left; display: inline-block; margin-top: 30px; }
    li { margin: 5px 0; }
    .current { font-weight: bold; color: darkred; }
    .progress-container { margin: 15px auto; width: 80%; }
    progress { width: 100%; height: 25px; }
    label { font-weight: bold; display: block; margin: 8px 0 4px; }
  </style>
</head>
<body>
  <h1>Workout Timer</h1>
  <div id="exercise">Get Ready</div>
  <img id="exercise-img" src="" alt="" style="display:none">
  <div id="time">--</div>
  <div id="next"></div>
  <img id="next-img" src="" alt="" style="display:none;">

  <button onclick="location.href='{{ url_for('index') }}'">Back</button>
  <button id="startBtn" onclick="startWorkout()">Start</button>
  <button id="pauseBtn" onclick="togglePause()" disabled>Pause</button>

  <h2>Workout Plan</h2>
  <ul id="workoutList">
    {% for ex in workout %}
      <li id="ex-{{ loop.index0 }}">{{ ex.name }}</li>
    {% endfor %}
  </ul>

  <script>
  const workout = [
    {% for ex in workout %}
      {
        name: "{{ ex.name }}",
        image: {{ url_for('static', filename=ex.image)|tojson }},
      }{% if not loop.last %},{% endif %}
    {% endfor %}
  ];
    const numSets = {{ num_sets }};
    const exDuration = {{ ex_duration }};
    const restDuration = {{ rest_duration }};
    const setRest = {{ set_rest }};
    const totalExercises = workout.length;

    let currentSet = 1;
    let currentIndex = 0;
    let phase = "exercise";
    let timer;
    let timeLeft = 0;
    let paused = false;

function updateProgress() {
  // Fill current set’s progress
  const percent = (currentIndex / totalExercises) * 100;
  document.getElementById(`set-fill-${currentSet-1}`).style.width = percent + "%";

  // Past sets should be 100%
  for (let s = 0; s < currentSet-1; s++) {
    document.getElementById(`set-fill-${s}`).style.width = "100%";
  }
}

    function showImage(currImg, nextImg) {
      const exImg = document.getElementById("exercise-img");
      const nextExImg = document.getElementById("next-img");

      if (currImg) {
        exImg.src = currImg;
        exImg.style.display = "block";
        exImg.onerror = () => exImg.style.display = "none";
      } else exImg.style.display = "none";

      if (nextImg) {
        nextExImg.src = nextImg;
        nextExImg.style.display = "block";
        nextExImg.onerror = () => nextExImg.style.display = "none";
      } else nextExImg.style.display = "none";
    }

    function startWorkout() {
      document.getElementById("startBtn").disabled = true;
      document.getElementById("pauseBtn").disabled = false;

      let countdown = 7;
      document.getElementById("exercise").innerText = "Starting in...";
      document.getElementById("time").innerText = countdown;
      document.getElementById("next").innerText = "";
      showImage(null, workout[0] ? workout[0].image : null);

      const countdownTimer = setInterval(() => {
        countdown--;
        document.getElementById("time").innerText = countdown;
        if (countdown <= 0) {
          clearInterval(countdownTimer);
          startExercise();
        }
      }, 1000);
    }

    function startExercise() {
      if (currentIndex >= workout.length) {
        if (currentSet < numSets) {
          phase = "setrest";
          timeLeft = setRest;
          document.getElementById("exercise").innerText = `Rest Between Sets (Set ${currentSet}/${numSets})`;
          document.getElementById("next").innerText = `Next: Set ${currentSet+1}/${numSets}`;
          showImage(null, null);
          highlightCurrent(-1);
          updateProgress();
          tick();
        } else {
          document.getElementById("exercise").innerText = "Workout Complete!";
          document.getElementById("time").innerText = "";
          document.getElementById("next").innerText = "";
          showImage(null, null);
          highlightCurrent(-1);
          updateProgress();
          autoSaveWorkout();
        }
        return;
      }

      phase = "exercise";
      const ex = workout[currentIndex];
      timeLeft = exDuration;
      document.getElementById("exercise").innerText =
        `Set ${currentSet}/${numSets} — Exercise ${currentIndex+1}/${totalExercises}: ${ex.name}`;
      const nextEx = (currentIndex < workout.length - 1) ? workout[currentIndex+1] : null;
      document.getElementById("next").innerText = nextEx
          ? `Next: Exercise ${currentIndex+2}/${totalExercises} — ${nextEx.name}`
          : (currentSet < numSets ? "Next: Rest Between Sets" : "Last exercise!");
      showImage(ex.image, nextEx ? nextEx.image : null);
      highlightCurrent(currentIndex);
      updateProgress();
      tick();
    }

    function startRest() {
      phase = "rest";
      timeLeft = restDuration;
      const nextEx = workout[currentIndex];
      document.getElementById("exercise").innerText =
        `Rest (Set ${currentSet}/${numSets}, Next: Exercise ${currentIndex+1}/${totalExercises})`;
      document.getElementById("next").innerText = `Next: ${nextEx.name}`;
      showImage(null, nextEx.image);
      highlightCurrent(-1);
      updateProgress();
      tick();
    }

    function tick() {
      if (paused) return;

      if (timeLeft <= 0) {
        clearTimeout(timer);
        if (phase === "exercise") {
          currentIndex++;
          if (currentIndex < workout.length) startRest();
          else startExercise();
        } else if (phase === "rest") {
          startExercise();
        } else if (phase === "setrest") {
          currentSet++;
          currentIndex = 0;
          startExercise();
        }
        return;
      }

      document.getElementById("time").innerText = formatTime(timeLeft);
      timeLeft--;
      timer = setTimeout(tick, 1000);
    }

    function togglePause() {
      paused = !paused;
      const btn = document.getElementById("pauseBtn");

      if (paused) {
        btn.innerText = "Resume";
        clearTimeout(timer);
      } else {
        btn.innerText = "Pause";
        tick();
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s.toString().padStart(2,"0")}`;
    }

    function highlightCurrent(index) {
      const items = document.querySelectorAll("#workoutList li");
      items.forEach((li, i) => {
        if (i === index) li.classList.add("current");
        else li.classList.remove("current");
      });
    }

    function autoSaveWorkout() {
      fetch("{{ url_for('save_current_workout') }}", { method: "POST" })
        .then(res => res.json())
        .then(data => {
          if (data.status === "saved") {
            document.getElementById("next").innerText = "Workout saved!";
          }
        });
    }
  </script>
</body>
</html>
