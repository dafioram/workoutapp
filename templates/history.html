<!doctype html>
<html>
<head>
  <title>Workout History</title>
</head>
<body>
  <h1>Workout History</h1>
  {% if workouts %}
    <ul>
      {% for w in workouts %}
        <li>
          <strong>{{ w.timestamp }}</strong>
          <ul>
            {% for ex in w.exercises %}
              <li>{{ ex.name }} (ID: {{ ex.id }})</li>
            {% endfor %}
          </ul>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No workouts saved yet.</p>
  {% endif %}
  <p><a href="{{ url_for('index') }}">Back to Generator</a></p>
</body>
</html>
