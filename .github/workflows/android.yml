name: Android build

# Builds an unsigned debug APK from the web app with Capacitor. The APK is
# uploaded as a workflow artifact. Signing comes later (see native/README.md).

on:
  push:
    branches: ['**']   # not tags: tags build the signed APK in release-apk.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image already has the Android SDK in $ANDROID_HOME. Accept
      # the licences and install the platform and build tools this project uses.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | head -n 1)/sdkmanager"
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor
        working-directory: native
        run: npm ci

      - name: Copy the web app into the bundle
        working-directory: native
        run: npm run prepare-www

      - name: Sync web assets into the Android project
        working-directory: native
        run: npx cap sync android

      - name: Build debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: workout-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
